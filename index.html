<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
</head>
<body>
    <div class="input-container">
        <input type="text" placeholder="Digite o nome da cidade">
        <button class="microfone-button">
            <img src="microfone.svg" alt="Microfone" class="microfone">
        </button>
        <button class="lupa-button">
            <img src="lupa.svg" alt="Lupa" class="lupa">
        </button>
    </div>

    <div class="info-container">
        <p class="cidade">Cidade: </p>
        <p class="temperatura">Temperatura: </p>
        <p class="descricao">Descrição: </p>
        <p class="umidade">Umidade: </p>
    </div>
</body>
</html>
